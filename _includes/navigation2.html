<script>

document.addEventListener('DOMContentLoaded', function() 
{
  // When the user scrolls the page, execute myFunction 
  window.addEventListener('scroll', navigation2);

  // Get the navbar
  var navbar = document.getElementById("navbar");

  // Get the offset position of the navbar
  var sticky = navbar.offsetTop;

  // Add the sticky class to the navbar when you reach its scroll 
  // position. Remove "sticky" when you leave the scroll position

  function navigation2() 
  {
    if (window.pageYOffset >= sticky) 
    {
      navbar.classList.add("sticky")
    } 
    else 
    {
      navbar.classList.remove("sticky");
    }
  }



});

</script>

<div class="navbar" id="navbar">

  <div class="wrapper">

  <a href="{{ '/' | relative_url }}" class="blog-logo-title">{{ site.title | escape }}</a>
    
  {% for item in site.data.navbar %}
  <a href="{{ item.link | relative_url }}">{{ item.name }}</a>
  {% endfor %} 



  </div>

  {%- include scroll-progress-bar.html -%}

</div>
